name: Build & Release Flex

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  schedule:
    - cron: '0 3 * * *' # Check daily at 3 AM UTC
  workflow_dispatch:     # Allows manual trigger anytime from Actions tab
    inputs:
      force_build:
        description: 'Force build even if tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest upstream release tag
        id: upstream
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/damontecres/Wholphin/releases/latest | jq -r '.tag_name')
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Failed to fetch upstream tag" >&2
            exit 1
          fi
          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $UPSTREAM_TAG"

      - name: Fetch latest fork release tag
        id: my_release
        run: |
          MY_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // "none"')
          echo "tag=$MY_TAG" >> $GITHUB_OUTPUT
          echo "Current fork release: $MY_TAG"

      - name: Determine if build is required
        id: should_build
        run: |
          EVENT="${{ github.event_name }}"
          FORCE="${{ inputs.force_build }}"
          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          MY_TAG="${{ steps.my_release.outputs.tag }}"

          if [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ] || [ "$UPSTREAM_TAG" != "$MY_TAG" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Triggering build for $UPSTREAM_TAG (event: $EVENT)"
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Fork is already up to date with $UPSTREAM_TAG. Skipping build."
          fi

          if [ "$UPSTREAM_TAG" != "$MY_TAG" ]; then
            echo "is_new_upstream=true" >> $GITHUB_OUTPUT
          else
            echo "is_new_upstream=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.should_build.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for Gradle git describe / version tags

      - name: Sync upstream changes
        if: steps.should_build.outputs.build == 'true'
        run: |
          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          git remote add upstream https://github.com/damontecres/Wholphin.git || true
          git fetch upstream --tags --force
          git fetch upstream main
          
          if [ "${{ steps.should_build.outputs.is_new_upstream }}" = "true" ]; then
            echo "New upstream release detected ($UPSTREAM_TAG). Merging upstream changes into main..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git merge --no-edit "$UPSTREAM_TAG" || {
              echo "Merge conflict detected while merging upstream $UPSTREAM_TAG" >&2
              exit 1
            }
            git push origin main || echo "Failed to push merge commit to main, proceeding with build"
          fi

      - name: Apply Flex Branding
        if: steps.should_build.outputs.build == 'true'
        run: |
          chmod +x .branding/apply_branding.sh
          .branding/apply_branding.sh "com.kasundsilva.flex"

      - name: Setup Build Environment
        if: steps.should_build.outputs.build == 'true'
        uses: ./.github/actions/setup

      - name: Build and Sign Default Release APK
        if: steps.should_build.outputs.build == 'true'
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"
        run: |
          SIGNING_KEY=$(echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n[:space:]')
          export SIGNING_KEY
          ./gradlew clean assembleDefaultRelease

      - name: Prepare Release APKs
        if: steps.should_build.outputs.build == 'true'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          DIR="app/build/outputs/apk/default/release"
          
          echo "Available APK files generated by Gradle:"
          ls -la "$DIR"
          
          # Find universal APK (named with universal or without ABI suffix)
          UNIVERSAL_APK=$(find "$DIR" -maxdepth 1 -name "*universal*.apk" | head -n 1)
          if [ -z "$UNIVERSAL_APK" ]; then
            UNIVERSAL_APK=$(find "$DIR" -maxdepth 1 -name "*.apk" ! -name "*arm64*" ! -name "*armeabi*" ! -name "*x86*" ! -name "*Flex*" | head -n 1)
          fi
          
          if [ -z "$UNIVERSAL_APK" ]; then
            echo "Error: Universal APK not found!" >&2
            exit 1
          fi
          
          echo "Identified Universal APK: $UNIVERSAL_APK"
          
          # Flex-vX.Y.Z.apk is the universal APK (default for Obtainium and all TV devices)
          cp "$UNIVERSAL_APK" "$DIR/Flex-${TAG}.apk"
          cp "$UNIVERSAL_APK" "$DIR/Flex-${TAG}-universal.apk"
          
          ARM64_APK=$(find "$DIR" -maxdepth 1 -name "*arm64*.apk" ! -name "*Flex*" | head -n 1)
          if [ -n "$ARM64_APK" ]; then
            cp "$ARM64_APK" "$DIR/Flex-${TAG}-arm64-v8a.apk"
          fi
          
          ARMV7_APK=$(find "$DIR" -maxdepth 1 -name "*armeabi*.apk" ! -name "*Flex*" | head -n 1)
          if [ -n "$ARMV7_APK" ]; then
            cp "$ARMV7_APK" "$DIR/Flex-${TAG}-armeabi-v7a.apk"
          fi
          
          X86_APK=$(find "$DIR" -maxdepth 1 -name "*x86*.apk" ! -name "*Flex*" | head -n 1)
          if [ -n "$X86_APK" ]; then
            cp "$X86_APK" "$DIR/Flex-${TAG}-x86_64.apk"
          fi
          
          echo "Prepared release assets:"
          ls -lh "$DIR"/Flex-*.apk

      - name: Publish GitHub Release
        if: steps.should_build.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: "Flex ${{ steps.upstream.outputs.tag }}"
          body: |
            Automated rebranded release of upstream [Wholphin ${{ steps.upstream.outputs.tag }}](https://github.com/damontecres/Wholphin/releases/tag/${{ steps.upstream.outputs.tag }}).
            
            ### Downloads:
            - **`Flex-${{ steps.upstream.outputs.tag }}.apk`**: **Universal APK** (works on all Google TV, Android TV, and Fire TV devices).
            - `Flex-${{ steps.upstream.outputs.tag }}-armeabi-v7a.apk`: 32-bit ARM (Chromecast with Google TV, Onn 4K, Fire TV Sticks).
            - `Flex-${{ steps.upstream.outputs.tag }}-arm64-v8a.apk`: 64-bit ARM (Nvidia Shield TV, modern Sony/Philips TVs).
            - `Flex-${{ steps.upstream.outputs.tag }}-universal.apk`: Universal build.
            
            ### Installation:
            - **Obtainium**: Add `https://github.com/${{ github.repository }}` for automated updates.
            - If you had Wholphin or a test build previously installed, **uninstall it first** from TV Settings -> Apps. Android prevents installing over an app signed with a different key.
          files: |
            app/build/outputs/apk/default/release/Flex-*.apk
          make_latest: true
